name: Skating feel / tuning feedback
description: Nothing is broken, but skating feels off (too fast, too twitchy, falls over too easily, ...).
title: "[Feel] "
labels: [ "tuning" ]
body:
- type: textarea
  id: feel
  attributes:
    label: What feels off?
    description: Describe the situation and what you'd expect skates to do.
    placeholder: At full speed a small tap on A/D makes the skater lean way too far and they almost fall over.
  validations:
    required: true

- type: textarea
  id: tuning
  attributes:
    label: Your tuning
    description: |
      If you changed settings to make it feel better, run `inline_skates_dump_tuning` in the console and paste the output.
      It marks every value you changed, so we can try your setup directly.
    render: text

- type: textarea
  id: media
  attributes:
    label: Video or screenshots
    description: Optional, but for handling a short clip says more than a paragraph.

- type: dropdown
  id: skates
  attributes:
    label: Which skates?
    description: If they're custom skates, name it and link to it in the description above.
    multiple: true
    options:
    - Built-in inline skates
    - Custom skate model
    - All skates
